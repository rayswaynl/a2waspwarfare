// Miksuu's Warfare server config - REPO SOURCE OF TRUTH (repo server-config/)
// MAINTENANCE CONTRACT (owner directive 2026-07-21): every deploy updates the template= line
// HERE first (via the release PR), then the deploy pushes this file to the box, splicing the
// box-local passwordAdmin in place of the redacted line. Never commit the real password.
//
// CORRECTED 2026-08-02 - the previous header claimed the box copies "are all rewritten at
// deploy so no stale pinned copy can silently revert the mission". That was FALSE and it cost
// a live restart. The facts, verified on 176.9.104.115:
//   * The server reads ONLY the path in its own command line:
//       -config=C:\WASP\profiles-pr8\server-pr8.cfg
//     Read that path out of the RPT boot banner before editing anything.
//   * C:\WASP\server-pr8.cfg (root) is a STALE DECOY - on 2026-08-02 it still read wave0722g /
//     single-mission / maxPlayers=56 while the effective cfg was a 3-map m0801h rotation at 58.
//     C:\WASP\PR8-JuneFeatureBundle\server-pr8.cfg is a third, staler copy. Nothing propagates
//     between any of them. Editing the wrong one is a silent no-op.
//   * The cfg is file-locked while arma2oaserver.exe runs. Order must be: validate the new text
//     while the server is still up -> stop the chain -> write -> restart (Deploy-Wasp "BUG 1").
//   * Tools/Ops/Set-MissionTemplate.ps1 must NOT be used on this file. It rewrites EVERY
//     matching template= line to one mission name and only warns on >1 match, which collapses
//     the rotation below into three copies of the same map. Write the whole block instead.
hostname = "Miksuu's Warfare | CTI | TvT | PvE | discord.me/warfare";
passwordAdmin = "__REDACTED_SET_ON_BOX__"; // real value lives ONLY on the box - never commit it
maxPlayers = 58; // 2026-07-25: +2 for the HC3/HC4 slots
persistent = 1;
BattlEye = 0;   // rc22 revert: BE handshake killed the HC clients (Player without identity) - HC BE identities needed before re-enable
kickDuplicate = 0;
verifySignatures = 0;
headlessClients[] = {"127.0.0.1"};
localClient[] = {"127.0.0.1"};

// Full 3-map rotation (owner ruling 2026-08-02, wave-20260802). Per the maintenance contract above,
// the _wave0802 build tag below MUST match the mission PBO names actually produced at deploy - if the
// deploy mints a different tag, update all three template= lines in the same release PR.
class Missions
{
	class PR8_Zargabad
	{
		template = "[61-2hc]warfarev2_073v48co_wave0802.zargabad";
		difficulty = "Veteran";
	};
	class PR8_Chernarus
	{
